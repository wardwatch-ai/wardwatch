name: catalog

# The scanners are per-OS, but macOS and Windows runners bill at 10x and 2x
# on a private repo. So pull requests and pushes test on Linux only, and
# macOS + Windows run nightly (only if the crate changed in the last day),
# from "Run workflow", or on pull requests labelled `full-ci`.

on:
  pull_request:
    paths:
      - "crates/wardwatch-catalog/**"
      - ".github/workflows/catalog.yml"
  push:
    branches: [main]
    paths:
      - "crates/wardwatch-catalog/**"
      - ".github/workflows/catalog.yml"
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: crates/wardwatch-catalog

jobs:
  changed:
    name: Catalog changed in the last day
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    defaults:
      run:
        working-directory: .
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '25 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=main&path=crates/wardwatch-catalog&since=$since&per_page=1" --jq length)
          if [ "$n" -gt 0 ]; then echo changed=true; else echo changed=false; fi >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.os }})
    needs: changed
    if: ${{ !cancelled() && needs.changed.result != 'failure' && (github.event_name != 'schedule' || needs.changed.outputs.changed == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        # Nightly: macOS + Windows. Manual run or `full-ci` label: all three.
        # Otherwise: Linux only.
        os: ${{ fromJSON(github.event_name == 'schedule' && '["macos-latest","windows-latest"]' || (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Real scan of the runner, to catch what sample data can't. Prints counts only.
      - run: cargo run --release --example scan -- --summary

  msrv:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.90
      - run: cargo test

  # The rpm scanner against a real rpm database.
  # Built on 24.04 so its glibc stays older than Fedora 41's.
  fedora:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --example scan
      # The crate is in the root Cargo workspace, so builds land in the root target/.
      - run: |
          docker run --rm -v "$GITHUB_WORKSPACE/target/release/examples/scan:/scan:ro" fedora:41 /scan --summary | tee out.txt
          grep -q '"Rpm"' out.txt
