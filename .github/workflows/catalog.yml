name: catalog

on:
  pull_request:
    paths:
      - "crates/wardwatch-catalog/**"
      - ".github/workflows/catalog.yml"
  push:
    branches: [main]
    paths:
      - "crates/wardwatch-catalog/**"
      - ".github/workflows/catalog.yml"

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: crates/wardwatch-catalog

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Real scan of the runner, to catch what sample data can't. Prints counts only.
      - run: cargo run --release --example scan -- --summary

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.90
      - run: cargo test

  # The rpm scanner against a real rpm database.
  # Built on 24.04 so its glibc stays older than Fedora 41's.
  fedora:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --example scan
      - run: |
          docker run --rm -v "$PWD/target/release/examples/scan:/scan:ro" fedora:41 /scan --summary | tee out.txt
          grep -q '"Rpm"' out.txt
