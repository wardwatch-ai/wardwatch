name: Desktop

# Builds and tests the desktop app.
# Bundles are built UNSIGNED to prove packaging works and are thrown away:
# this workflow never signs, uploads or publishes anything.
#
# macOS and Windows runners bill at 10x and 2x on a private repo, so:
# - pull requests and pushes to main build on Linux only;
# - macOS and Windows run nightly, only if main changed in the last day;
# - the full matrix also runs from "Run workflow" (any branch) and on pull
#   requests labelled `full-ci` (applies from the next push).

on:
  push:
    branches: [main]
    # Not README.md, e2e/ or e2e.yml: the ui job's `pnpm format:check` covers them.
    paths-ignore:
      - "packaging/**"
      - "tests/devices/**"
      - ".github/workflows/catalog.yml"
      - ".github/workflows/ui.yml"
  pull_request:
    # Not README.md, e2e/ or e2e.yml: the ui job's `pnpm format:check` covers them.
    paths-ignore:
      - "packaging/**"
      - "tests/devices/**"
      - ".github/workflows/catalog.yml"
      - ".github/workflows/ui.yml"
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changed:
    name: Main changed in the last day
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '25 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=main&since=$since&per_page=1" --jq length)
          if [ "$n" -gt 0 ]; then echo changed=true; else echo changed=false; fi >> "$GITHUB_OUTPUT"

  ui:
    name: Desktop UI lint, typecheck, test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # packages/ui has its own workflow (ui.yml); check only the app here.
      - run: pnpm --filter @wardwatch/desktop lint
      - run: pnpm --filter @wardwatch/desktop typecheck
      - run: pnpm --filter @wardwatch/desktop test

  visual:
    name: Screens match Matt's reviewed designs
    # Screenshots are compared on one pinned OS and browser so rendering is stable.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        working-directory: apps/desktop
        run: pnpm exec playwright install --with-deps chromium
      - name: Compare screens with their approved versions
        id: gate
        working-directory: apps/desktop
        run: pnpm visual
      - name: Build the review set (mock, app and diff per screen)
        if: failure() && steps.gate.outcome == 'failure'
        working-directory: apps/desktop
        env:
          # Screens are approved from these CI renders, tagged with the PR head.
          VISUAL_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm visual:review
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.gate.outcome == 'failure'
        with:
          name: visual-review
          # out/: the review set. results/: the gate's actual/expected/diff images.
          path: |
            apps/desktop/e2e/visual/out/
            apps/desktop/e2e/results/
          retention-days: 14

  app:
    name: App (${{ matrix.os }})
    needs: changed
    if: ${{ !cancelled() && needs.changed.result != 'failure' && (github.event_name != 'schedule' || needs.changed.outputs.changed == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        # Nightly: macOS + Windows (Linux already ran on the push to main).
        # Manual run or `full-ci` label: all three. Otherwise: Linux only.
        os: ${{ fromJSON(github.event_name == 'schedule' && '["macos-latest","windows-latest"]' || (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["ubuntu-24.04","macos-latest","windows-latest"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rust format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Build unsigned bundles
        working-directory: apps/desktop
        # No signing identity or updater key is configured, so Tauri skips signing.
        run: pnpm tauri build --ci
