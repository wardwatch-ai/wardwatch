name: cla

# CLA bot (CLA Assistant Lite). Asks first-time contributors to sign CLA.md by
# posting a comment, and records signatures on the `cla-signatures` branch.
#
# Uses pull_request_target because it must comment on and set a status for
# PRs from forks. That is safe only because it never checks out or runs code
# from the PR: it reads PR metadata and comments, nothing else. Never add a
# checkout step to this workflow, and never use pull_request_target elsewhere.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write # commit signatures to the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/wardwatch-ai/wardwatch/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: theRealWardo,claude,*[bot]
          lock-pullrequest-aftermerge: true
