name: mobile

on:
  push:
    branches: [main]
    paths: ["apps/android/**", "apps/ios/**", "packages/ui/src/tokens/brand.json", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["apps/android/**", "apps/ios/**", "packages/ui/src/tokens/brand.json", ".github/workflows/mobile.yml"]

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Unsigned builds only. CI never signs, uploads or publishes the mobile apps.
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew test lintDebug assembleDebug assembleRelease

  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test WardwatchKit
        run: swift test --package-path WardwatchKit
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen
      - name: Build for the simulator, unsigned
        run: >
          xcodebuild build -project Wardwatch.xcodeproj -scheme Wardwatch
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
