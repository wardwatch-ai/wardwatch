[workspace]
resolver = "3"
# Libraries go in crates/<name>; list each one here.
members = ["apps/desktop/src-tauri", "crates/wardwatch-catalog", "crates/wardwatch-feed", "crates/wardwatch-update"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/wardwatch-ai/wardwatch"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
