# XcodeGen spec. Run `xcodegen` in apps/ios to create Wardwatch.xcodeproj (not committed).
name: Wardwatch
options:
  bundleIdPrefix: ai.wardwatch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  WardwatchKit:
    path: WardwatchKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Wardwatch:
    type: application
    platform: iOS
    sources:
      - path: Wardwatch
    dependencies:
      - package: WardwatchKit
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.wardwatch.mobile
        PRODUCT_NAME: Wardwatch
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wardwatch
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Signing is Matt's: local and CI builds pass CODE_SIGNING_ALLOWED=NO.
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
    info:
      path: Wardwatch/Info.plist
      properties:
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-SemiBold.ttf
          - Manrope-ExtraBold.ttf
