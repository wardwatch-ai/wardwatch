[package]
name = "wardwatch-catalog"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Finds the OS version, browsers, and installed and running software on macOS, Windows and Linux."
publish = false

[dependencies]
plist = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
