[package]
name = "wardwatch-update"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Plans and runs one update with the device's own updater: Homebrew, MacPorts, winget, apt, dnf, snap, flatpak, AppImageUpdate or the OS's settings."
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
wardwatch-catalog = { path = "../wardwatch-catalog" }
wardwatch-feed = { path = "../wardwatch-feed" }

[dev-dependencies]
serde_json = "1.0"
tempfile = "3"

[lints]
workspace = true
